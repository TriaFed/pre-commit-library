# ANSIBLE HOOKS
# =============================================================================

- id: ansible_lint
  name: Ansible linting
  entry: hooks/ansible_lint.sh
  language: script
  files: \.(yml|yaml)$
  require_serial: false

- id: ansible_syntax_check
  name: Ansible syntax validation
  entry: hooks/ansible_syntax_check.sh
  language: script
  files: \.(yml|yaml)$
  require_serial: false

