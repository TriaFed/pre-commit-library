# Pre-commit hooks library for GenAI code validation and security
# Supports: Node.js, Angular, React, Python, TypeScript, Java, Terraform, CloudFormation

# =============================================================================
# LINTING AND CODE QUALITY HOOKS
# =============================================================================

# Python linting and formatting
- id: python_black
  name: Black (Python formatter)
  entry: black
  language: python
  types: [python]
  require_serial: false

- id: python_flake8
  name: Flake8 (Python linter)
  entry: flake8
  language: python
  types: [python]
  require_serial: false

- id: python_isort
  name: isort (Python import sorter)
  entry: isort
  language: python
  types: [python]
  require_serial: false

- id: python_mypy
  name: MyPy (Python type checker)
  entry: mypy
  language: python
  types: [python]
  require_serial: false

# JavaScript/TypeScript/Node.js linting
- id: eslint
  name: ESLint (JavaScript/TypeScript linter)
  entry: hooks/eslint.sh
  language: script
  files: \.(js|jsx|ts|tsx)$
  require_serial: false

- id: prettier
  name: Prettier (Code formatter)
  entry: hooks/prettier.sh
  language: script
  files: \.(js|jsx|ts|tsx|json|css|scss|md|html)$
  require_serial: false

- id: typescript_check
  name: TypeScript compiler check
  entry: hooks/tsc_check.sh
  language: script
  files: \.tsx?$
  require_serial: false

# Angular specific
- id: angular_lint
  name: Angular linting
  entry: hooks/angular_lint.sh
  language: script
  files: \.(ts|html|scss|css)$
  pass_filenames: false
  require_serial: false

# Java linting
- id: java_checkstyle
  name: Java Checkstyle
  entry: hooks/java_checkstyle.sh
  language: script
  files: \.java$
  require_serial: false

- id: java_spotbugs
  name: Java SpotBugs
  entry: hooks/java_spotbugs.sh
  language: script
  files: \.java$
  require_serial: false

# Infrastructure as Code
- id: terraform_fmt
  name: Terraform format
  entry: terraform fmt
  language: system
  files: \.tf$
  require_serial: false

- id: terraform_validate
  name: Terraform validate
  entry: hooks/terraform_validate.sh
  language: script
  files: \.tf$
  require_serial: false

- id: terraform_tflint
  name: TFLint (Terraform linter)
  entry: tflint
  language: system
  files: \.tf$
  require_serial: false

- id: cloudformation_validate
  name: CloudFormation template validation
  entry: hooks/cfn_validate.sh
  language: script
  files: \.(yaml|yml|json)$
  require_serial: false

# =============================================================================
# AI-POWERED VALIDATION HOOKS
# =============================================================================

- id: ai_commit_check
  name: AI-powered commit validation
  entry: ai_commit_check
  language: python
  pass_filenames: false
  stages: [pre-commit]
  require_serial: true
  additional_dependencies: ['opencode-ai>=0.1.0a36', 'rich>=13.7.0']

# =============================================================================
# SECURITY SCANNING HOOKS
# =============================================================================

# Secret scanning
- id: detect_secrets
  name: Detect secrets
  entry: detect-secrets-hook
  language: python
  types: [text]
  require_serial: false

- id: truffhog
  name: TruffleHog secret scanner
  entry: hooks/truffhog.sh
  language: script
  types: [text]
  require_serial: false

# Custom security checks for GenAI code
- id: hardcoded_urls
  name: Detect hardcoded URLs
  entry: detect_hardcoded_urls
  language: python
  types: [text]
  require_serial: false

- id: hardcoded_credentials
  name: Detect hardcoded credentials
  entry: detect_hardcoded_credentials
  language: python
  types: [text]
  require_serial: false

- id: genai_security_check
  name: GenAI-specific security validation
  entry: genai_security_check
  language: python
  types: [text]
  require_serial: false

- id: detect_verbose_flags
  name: Detect verbose flags and debug logging
  entry: detect_verbose_flags
  language: python
  types: [text]
  require_serial: false

# Vulnerability scanning
- id: safety_python
  name: Safety (Python dependency vulnerability scanner)
  entry: safety
  language: python
  pass_filenames: false
  files: requirements.*\.txt$
  require_serial: false

- id: npm_audit
  name: npm audit (Node.js vulnerability scanner)
  entry: hooks/npm_audit.sh
  language: script
  files: package\.json$
  pass_filenames: false
  require_serial: false

- id: yarn_audit
  name: Yarn audit (Node.js vulnerability scanner)
  entry: hooks/yarn_audit.sh
  language: script
  files: package\.json$
  pass_filenames: false
  require_serial: false

# SAST scanning
- id: bandit
  name: Bandit (Python security linter)
  entry: bandit
  language: python
  types: [python]
  args: ['-r', '.']
  require_serial: false

- id: semgrep
  name: Semgrep (Multi-language SAST)
  entry: hooks/semgrep.sh
  language: script
  types: [text]
  require_serial: false

# =============================================================================
# GENERAL VALIDATION HOOKS
# =============================================================================

# File format validation
- id: check_xml
  name: Check XML syntax
  entry: check_xml
  language: python
  files: \.xml$

# Note: For standard file validation hooks like check-yaml, check-json, 
# trailing-whitespace, end-of-file-fixer, etc., use the official pre-commit-hooks:
# 
# repos:
#   - repo: https://github.com/pre-commit/pre-commit-hooks
#     rev: v4.4.0
#     hooks:
#       - id: check_yaml
#       - id: check_json
#       - id: trailing_whitespace
#       - id: end_of_file_fixer
#       - id: check_merge_conflict
#       - id: mixed_line_ending
#       - id: check_toml

# License and copyright validation
- id: check_license
  name: Check for license headers
  entry: check_license
  language: python
  types: [text]
  require_serial: false

# Note: For large file detection, use the official pre-commit-hooks:
# - id: check_added_large_files
#   args: [--maxkb=1000]

# Docker security
- id: dockerfile_lint
  name: Dockerfile linting
  entry: hooks/dockerfile_lint.sh
  language: script
  files: Dockerfile

